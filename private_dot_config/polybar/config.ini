;==========================================================
;
;   Polybar config (final refined)
;
;==========================================================

[colors]
background = #232136
background-alt = #44415a
foreground = #e0def4
primary = #ea9a97
secondary = #f6c177
alert = #eb6f92
disabled = #6e6a86

[bar/bar]
width = 100%
height = 24pt
radius = 6

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt
border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = JetBrainsMonoNL Nerd Font:style=Regular:size=11;2

modules-left = xworkspaces xwindow
modules-right = filesystem pulseaudio xkeyboard memory cpu wlan backlight eth date time battery

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

;==========================================================

[module/systray]
type = internal/tray
format-margin = 8pt
tray-spacing = 16pt

;==========================================================

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline = ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

;==========================================================

[module/xwindow]
type = internal/xwindow
label = %title:0:50:...%

;==========================================================

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

format-mounted = <label-mounted>
format-mounted-prefix = " "
format-mounted-prefix-foreground = ${colors.primary}

format-unmounted = <label-unmounted>

label-mounted = %percentage_used%%
label-unmounted =  not mounted
label-unmounted-foreground = ${colors.disabled}

;==========================================================

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = " muted"
label-muted-foreground = ${colors.disabled}

;==========================================================

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

format-prefix = " "
format-prefix-foreground = ${colors.primary}

label-layout = %layout%

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

;==========================================================

[module/memory]
type = internal/memory
interval = 2

format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

;==========================================================

[module/cpu]
type = internal/cpu
interval = 2

format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

;==========================================================

[network-base]
type = internal/network
interval = 5

format-connected = <label-connected>
format-disconnected = <label-disconnected>

label-connected = %essid%
label-disconnected = disconnected
label-disconnected-foreground = ${colors.disabled}

[module/wlan]
inherit = network-base
interface-type = wireless

format-connected = <label-connected>
format-connected-prefix = "󱚽 "
format-connected-prefix-foreground = ${colors.primary}
label-connected = %essid% %local_ip%

format-disconnected = <label-disconnected>
label-disconnected = 󰖪
label-disconnected-foreground = ${colors.primary}

[module/eth]
inherit = network-base
interface-type = wired

format-connected = <label-connected>
format-connected-prefix = "󰈁 "
format-connected-prefix-foreground = ${colors.primary}
label-connected = %local_ip%

format-disconnected = <label-disconnected>
label-disconnected = 󰈂
label-disconnected-foreground = ${colors.primary}

;==========================================================

[module/date]
type = internal/date
interval = 60

date = %Y-%m-%d

format-prefix = " "
format-prefix-foreground = ${colors.primary}

label = %date%


[module/time]
type = internal/date
interval = 1

time = %H:%M
time-alt = %H:%M:%S

format-prefix = " "
format-prefix-foreground = ${colors.primary}

label = %time%
;==========================================================

[module/battery]
type = internal/battery
full-at = 99
low-at = 10

battery = BAT0
adapter = AC

poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full-prefix = " "
format-full-prefix-foreground = ${colors.primary}

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

ramp-capacity-0-foreground = ${colors.primary}
ramp-capacity-1-foreground = ${colors.primary}
ramp-capacity-2-foreground = ${colors.primary}
ramp-capacity-3-foreground = ${colors.primary}
ramp-capacity-4-foreground = ${colors.primary}

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-5 = 

animation-charging-0-foreground = ${colors.primary}
animation-charging-1-foreground = ${colors.primary}
animation-charging-2-foreground = ${colors.primary}
animation-charging-3-foreground = ${colors.primary}
animation-charging-4-foreground = ${colors.primary}
animation-charging-5-foreground = ${colors.primary}

animation-charging-framerate = 750

;==========================================================

[module/backlight]
type = internal/backlight
card = intel_backlight

use-actual-brightness = true
poll-interval = 0
enable-scroll = true
scroll-interval = 10

format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage%%

;==========================================================

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
